---
- name: Set up Substrate node
  hosts: all
  become: true
  gather_facts: true
  vars:
    allowed_node_types: [validator]
  vars_files:
    - group_vars/all.yml
    - group_vars/vault.yml
    - group_vars/{{ env }}.yml

  pre_tasks:
    - name: Setup environment and dependencies
      when: type in allowed_node_types
      block:
        - name: Include environment setup tasks
          ansible.builtin.include_tasks: tasks/setup_environment.yml

  tasks:
    - name: Run node role
      when: type in allowed_node_types
      block:
        - name: Include common handlers
          ansible.builtin.include_role:
            name: common
        - name: Include node role
          ansible.builtin.include_role:
            name: node
            public: true

  post_tasks:
    - name: Verify node
      when: type in allowed_node_types
      block:
        # avail-node prints only three parts of its version (2.3.4 for v2.3.4.0 to v2.3.4.3), so it has no version check
        - name: Include verify service task for avail
          when: project == 'avail'
          ansible.builtin.include_tasks: tasks/verify_service.yml
          vars:
            log_file_path: "{{ node_log_file_path }}"
            health_url: "http://localhost:{{ avail[type].ports.rpc_port }}/health"

        - name: Include verify service task for vara
          when: project == 'vara'
          ansible.builtin.include_tasks: tasks/verify_service.yml
          vars:
            log_file_path: "{{ node_log_file_path }}"
            version_command: "{{ node_bin_dir }}/{{ service_identifier }} --version"
            expected_version: "{{ vara[type].version | regex_replace('^v', '') }}"
            health_url: "http://localhost:{{ vara[type].ports.rpc_port }}/health"
